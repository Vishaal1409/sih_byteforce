# config/backtest.yaml — reference series for the Phase 6 backtest
#
# ============================================================================
# THE REFERENCE SERIES IS A STAND-IN. IT IS NOT DGCA DATA.
# ============================================================================
#
# What was attempted (2026-09-10): DGCA's portal (dgca.gov.in) and the Ministry
# of Civil Aviation site were both reachable, but serve a JavaScript shell with
# no machine-readable fare series behind it; DGCA's traffic material is
# published as monthly PDF reports. data.gov.in's catalogue API returns HTTP 400
# without a registered API key.
#
# The blocking problem is not access, it is GRANULARITY. DGCA publishes
# MONTHLY aggregates. APIx here is a DAILY series over 35 days. There is no
# real DGCA daily average-fare series to validate against, so no amount of
# scraping would have produced one.
#
# TASKS.md Phase 6 anticipates exactly this and permits a synthesized stand-in,
# clearly labelled. That is what this is.
#
# ---------------------------------------------------------------------------
# HOW THE STAND-IN IS BUILT, AND WHY IT IS NOT RIGGED
# ---------------------------------------------------------------------------
# The reference is deliberately NOT a copy of APIx with noise added - that
# would produce a meaninglessly perfect correlation and prove nothing.
#
# Instead it is computed the way a simple published average-fare statistic
# actually is: an UNWEIGHTED mean of every observed fare, rebased to 100 at the
# same base date. That is a genuinely different estimator from APIx, which is
# weighted by traffic and market share and stratified by booking window.
#
# The gap between the two is therefore real and interpretable: it is the
# composition effect that APIx is designed to remove and a naive average is
# not. A backtest that agrees closely but not perfectly is the honest and
# expected result.
#
# WHERE REAL DGCA DATA PLUGS IN: replace build_reference_series() in
# index/backtest.py with a loader for the DGCA series and keep everything else.
# The comparison code does not care where the reference came from.

backtest_version: "0.1"

reference:
  # Shown on every chart and API response carrying this series.
  label: "DGCA-style reference (SYNTHETIC STAND-IN - not real DGCA data)"
  short_label: "Reference (synthetic)"
  is_real_data: false

  # An unweighted market mean, as a simple published average would be.
  method: "unweighted_market_mean"

  # Independent measurement noise, standing in for survey/collection error in a
  # published statistic. Applied per day, multiplicatively.
  noise_sd: 0.018
  random_seed: 771026

  # Published aggregates are smoothed and lagged relative to live prices.
  # A centred rolling mean over this many days approximates that.
  smoothing_days: 3

comparison:
  # TASKS.md asks for 30+ days.
  min_days: 30
  # Both series are rebased to 100 at the first common date so that levels,
  # not just shapes, are comparable.
  rebase_to_common_base: true
