# config/airlines.yaml — carriers in the APIx basket
#
# WHY THESE CARRIERS: these four account for the overwhelming majority of Indian
# scheduled domestic capacity. Regional/charter operators are excluded to keep the
# basket stable -- a carrier entering or exiting would otherwise break index
# continuity.
#
# SOURCE OF WEIGHTS: market_share_weight approximates DGCA-reported domestic
# passenger market share (DGCA monthly traffic report, "Market Share of Domestic
# Airlines"). "Air India" here means the merged Air India group, i.e. Air India
# including Vistara and Air India Express / AIX Connect.
#
# HONESTY NOTE: as with routes.yaml, these are APPROXIMATE and hand-set to reflect
# recent reported shares, not copied from one specific DGCA month. Normalised to
# sum to 1.0 across the four carriers.
#
# carrier_type drives the budget vs. full-service fare offset in the Phase 2
# simulator -- it is a modelling input, not a DGCA figure.

basket_version: "0.1"
weights_normalised: true

airlines:
  - code: "6E"
    name: "IndiGo"
    carrier_type: budget
    market_share_weight: 0.64

  - code: "AI"
    name: "Air India"          # merged group: AI + Vistara + Air India Express
    carrier_type: full_service
    market_share_weight: 0.27

  - code: "QP"
    name: "Akasa Air"
    carrier_type: budget
    market_share_weight: 0.05

  - code: "SG"
    name: "SpiceJet"
    carrier_type: budget
    market_share_weight: 0.04
