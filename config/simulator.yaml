# config/simulator.yaml — parameters for the Phase 2 fare simulator
#
# READ THIS FIRST: every number in this file is a MODELLING ASSUMPTION, not an
# observation. It describes how scraper/simulator.py *pretends* to be an airline
# pricing engine. Nothing here is sourced from DGCA, an airline, or a scrape.
# Rows produced from it are written with source = 'simulated' and are labelled as
# such in the API and on the dashboard (CLAUDE.md ground rule 5).
#
# The shapes are chosen to match the well-documented qualitative behaviour of
# Indian domestic airfares: cheap and flat far from departure, rising steeply
# inside three weeks, very steep in the last week, with festival and long-weekend
# spikes on top.

simulator_version: "0.1"

# Deterministic output: the same (airline, route, travel_date, query_date) always
# produces the same quote, so re-running the backfill refreshes rows rather than
# jittering the whole dataset. Change this to regenerate a different world.
random_seed: 20260910


# ---------------------------------------------------------------------------
# Booking-window curve
# ---------------------------------------------------------------------------
# Multiplier on the route base fare as a function of advance_purchase_days:
#
#     w(apd) = 1 + amplitude * exp(-apd / decay_days)
#
# Far out the exponential vanishes and fares sit near the base; close in it
# dominates. With the defaults below the last-minute fare is ~2.5x the 45-day
# fare, which is in the right range for Indian domestic economy.
booking_curve:
  amplitude: 1.6         # how much dearer a same-day fare is vs. the floor
  decay_days: 12.0       # smaller = the spike starts later and is sharper


# ---------------------------------------------------------------------------
# Day-of-week effect (applied on travel_date)
# ---------------------------------------------------------------------------
# Business-heavy trunk routes peak on Friday and Sunday, trough midweek.
day_of_week_multiplier:
  monday: 1.05
  tuesday: 0.93
  wednesday: 0.92
  thursday: 1.00
  friday: 1.15
  saturday: 0.98
  sunday: 1.12


# ---------------------------------------------------------------------------
# Airline positioning
# ---------------------------------------------------------------------------
# Full-service carriers price above low-cost carriers on the same sector. Applied
# by carrier_type from config/airlines.yaml, with optional per-airline nudges for
# the brand premium/discount within each class.
carrier_type_multiplier:
  budget: 0.97
  full_service: 1.18

airline_multiplier:      # multiplicative, on top of carrier_type
  "6E": 1.03             # IndiGo: schedule breadth commands a small premium
  "AI": 1.00
  "QP": 0.98             # Akasa: newer entrant, buying share
  "SG": 0.94             # SpiceJet: discounting to fill


# ---------------------------------------------------------------------------
# Taxes and fees
# ---------------------------------------------------------------------------
# Modelled as: a fixed per-passenger component (UDF/PSF-style airport charges),
# plus a distance-scaled surcharge (fuel/route cost), plus 5% of base fare (the
# GST rate applicable to economy domestic tickets).
taxes:
  fixed_component_inr: 700          # airport/user development charges
  per_1000km_surcharge_inr: 260     # scaled by route distance_km
  gst_rate_on_base: 0.05
  noise_sd_inr: 40                  # small per-quote variation


# ---------------------------------------------------------------------------
# Availability
# ---------------------------------------------------------------------------
# Some quotes come back with no fare — sold out, or the airline simply does not
# publish one. Probability rises sharply as departure approaches.
#
#     p(sold_out) = base_probability + near_term_probability * exp(-apd / decay_days)
availability:
  base_probability: 0.01
  near_term_probability: 0.14
  decay_days: 8.0


# ---------------------------------------------------------------------------
# Random noise
# ---------------------------------------------------------------------------
# Multiplicative lognormal jitter, so fares vary quote-to-quote without ever
# going negative.
noise:
  lognormal_sigma: 0.07


# ---------------------------------------------------------------------------
# Demand shocks
# ---------------------------------------------------------------------------
# Festival and long-weekend windows where fares spike. Matched on travel_date.
#
# HONESTY NOTE: these dates are approximate and illustrative. Festival dates move
# year to year with the Hindu calendar, and the exact dates are not the point --
# the point is that the index must visibly respond to a demand shock. Edit this
# list to move the shocks; nothing else needs to change.
#
# multiplier_min/max: the base fare is multiplied by a value drawn uniformly from
# this range, giving the 150-300% spike the brief calls for.
demand_shocks:
  - name: "Gandhi Jayanti long weekend"
    start_date: "2026-10-02"
    end_date: "2026-10-04"
    multiplier_min: 1.5
    multiplier_max: 2.2

  - name: "Navratri travel peak"
    start_date: "2026-10-10"
    end_date: "2026-10-13"
    multiplier_min: 1.6
    multiplier_max: 2.4

  - name: "Dussehra"
    start_date: "2026-10-19"
    end_date: "2026-10-21"
    multiplier_min: 1.8
    multiplier_max: 3.0


# ---------------------------------------------------------------------------
# Backfill extent (Phase 2 dataset generation)
# ---------------------------------------------------------------------------
# query_dates: the last `query_date_days` days up to and including today.
# advance-purchase windows: apd = 1 .. max_advance_purchase_days for each.
backfill:
  query_date_days: 35
  max_advance_purchase_days: 45
  booking_class: "ECONOMY"
  currency: "INR"
