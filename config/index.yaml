# config/index.yaml — APIx index construction parameters
#
# The formula and the reasoning behind these choices are written up for a
# non-technical reader in docs/methodology.md. This file is the machine-readable
# version, and the single place to change any of it.

index_version: "0.1"

base_period:
  # The index is 100 at the base period by construction.
  #
  # TASKS.md specifies "first available date". That is what this does by
  # default (days: 1). The option exists because a single day's fares carry
  # sampling noise straight into every later value -- every point in the series
  # is divided by that one day. Averaging the first few days would be more
  # stable; it is left at 1 to match the spec, and the sensitivity is stated
  # openly in docs/methodology.md.
  days: 1

# Advance-purchase buckets. Fares behave very differently across the booking
# window, so the basket is stratified by lead time as well as by route and
# carrier -- otherwise a shift in WHEN people are observed booking would look
# like a change in the price level.
#
# HONESTY NOTE: these bucket weights are a modelling assumption. Booking-lead-
# time distributions for Indian domestic travel are not published at this
# granularity. They are shaped to reflect the widely-reported pattern that most
# domestic leisure and business booking happens inside three weeks of travel.
# Normalised to sum to 1.0.
advance_purchase_buckets:
  - name: "0-3d"
    min_days: 1
    max_days: 3
    weight: 0.12
  - name: "4-7d"
    min_days: 4
    max_days: 7
    weight: 0.18
  - name: "8-14d"
    min_days: 8
    max_days: 14
    weight: 0.24
  - name: "15-21d"
    min_days: 15
    max_days: 21
    weight: 0.20
  - name: "22-30d"
    min_days: 22
    max_days: 30
    weight: 0.16
  - name: "31-45d"
    min_days: 31
    max_days: 45
    weight: 0.10

weighting:
  # Cell weight = route traffic share x airline market share x bucket weight,
  # taken from routes.yaml, airlines.yaml and the buckets above.
  #
  # When a cell has no observation on a given day (sold out, or no fare
  # published), its weight is redistributed proportionally across the cells that
  # DO have one, so the index stays comparable day to day. The alternative --
  # treating a missing cell as zero -- would make the index fall whenever
  # availability dropped, which is the opposite of what actually happens to
  # prices when seats sell out.
  renormalise_on_missing: true

  # If fewer than this fraction of the basket's weight is observable on a day,
  # that day is reported with a coverage warning rather than silently published.
  min_coverage: 0.60

elasticity:
  # Lead-time elasticity is fitted as OLS of ln(total_fare) on
  # advance_purchase_days, per route, pooled across carriers and travel dates.
  # The reported figure is the percentage fare change per day CLOSER to
  # departure, i.e. exp(-slope) - 1.
  #
  # Log-linear because the booking curve is multiplicative: a fare rising 4% a
  # day compounds, and a linear fit in rupees would under-read short lead times
  # and over-read long ones.
  min_observations: 30
  max_advance_purchase_days: 45

  # Control for travel-date effects (a within / fixed-effects estimator).
  #
  # This matters a lot. In a rolling panel, lead time is correlated with WHICH
  # departure you are looking at: a 45-day quote observed today is for a date
  # six weeks out, and some of those dates are festivals. Pooled OLS therefore
  # attributes part of the festival premium to long lead times and flattens the
  # curve. Measured on this panel it understated elasticity by about 30%
  # (1.11%/day pooled vs 1.57%/day controlled) and halved the fit quality
  # (R2 0.28 vs 0.51).
  #
  # With this on, ln(fare) and advance_purchase_days are both demeaned within
  # each travel_date before fitting, so the slope is identified only from
  # comparing quotes for THE SAME departure at different lead times -- which is
  # what "how much does waiting cost me" actually means.
  control_for_travel_date: true

aggregation:
  # Weekly and monthly APIx are the mean of the daily index over the period.
  # Recomputing from period-pooled cells would mix days with different
  # availability and make the levels non-comparable to the daily series.
  weekly_label: "W-MON"
  monthly_label: "MS"
  # Periods with fewer than this many daily observations are dropped rather
  # than reported as a partial week/month.
  min_days_weekly: 4
  min_days_monthly: 15
